[project]
name = "ghostc"
version = "0.1.0"
description = "Privacy compiler + agent workflow: real repo <-> privacy-safe ghost repo"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
    "rapidfuzz>=3.6",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional: real sentence embeddings for the semantic detection signal. Absent, the
# signal falls back to a stdlib char-n-gram cosine (see ghostc/detect/semantic.py).
semantic = ["sentence-transformers>=3"]

[project.scripts]
ghostc = "ghostc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["ghostc", "ghostc.agents", "ghostc.detect", "ghostc.parsers"]
