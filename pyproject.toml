[project]
name = "ghostc"
version = "0.1.0"
description = "Privacy compiler + agent workflow: real repo <-> privacy-safe ghost repo"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ghostc = "ghostc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghostc", "ghostc.agents", "ghostc.parsers"]
