<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwind Airlines — Flight Operations</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Northwind Airlines — Flight Operations</h1>
    <span class="badge" id="provider-badge">Schedule data: SkyRoute Data Ltd</span>
  </header>

  <main>
    <section id="status">
      <h2>Service status</h2>
      <dl id="status-grid"><dt>loading…</dt><dd></dd></dl>
    </section>

    <section id="board">
      <h2>Departure board</h2>
      <table>
        <thead>
          <tr><th>Flight</th><th>From</th><th>To</th><th>Departs</th><th>Status</th></tr>
        </thead>
        <tbody id="flights"><tr><td colspan="5">loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
